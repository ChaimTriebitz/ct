name: Portfolio CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and regenerate the lockfile
        run: npm install

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: ct-generated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build
